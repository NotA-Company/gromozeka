# markdown-mcp configuration for the gromozeka docs tree.
# Minimal on purpose (zero-config dogfood): everything not set here uses the
# built-in defaults - e5-small embeddings, the measured min_score floor,
# no exclude patterns, and the default index location ./.markdown-mcp/index.db
# (resolved relative to this file and covered by .gitignore).
# Discovered by walking upward from the working directory.

[docs]
root = "./docs"
exclude = ["archive/", "other/"]
writable = true
rescan_interval = 30

[index]
#location = "./.markdown-mcp/index.db"
#model = "e5-small"

[read]
# Deliberate owner-ratified caps (2026-09-06), not drift.
section_read_cap = 8192
disk_read_cap = 65536
