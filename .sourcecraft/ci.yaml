on:
  pull_request:
    - workflows: make-test
      filter:
        # source_branches: ["**", "!test**"]
        target_branches: ["main", "master", "trunk"]
  push:
    - workflows: make-test
      filter:
        branches: ["main", "master", "trunk"]

workflows:
  make-test:
    tasks:
      - do-make-test
      
tasks:
  - name: do-make-test
    cubes: 
      - name: do-make-check-test
        image: docker.io/library/alpine:3.24
        # In-container CI script is the single source of truth at scripts/ci.sh
        # (also invoked by `make ci`), so this cube and the local runner cannot drift.
        script:
          - sh scripts/ci.sh

    
