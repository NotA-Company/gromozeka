[models.providers.yc-openai]
type = "yc-openai"
# https://yandex.cloud/ru/docs/foundation-models/operations/get-api-key
folder_id = "${YC_FOLDER_ID}"
api_key = "${YC_API_KEY}"

[models.providers.openrouter]
type = "openrouter"
api_key = "${OPENROUTER_API_KEY}"

[models.providers.yc-sdk]
type = "yc-sdk"
folder_id = "${YC_FOLDER_ID}"
# Optional: specify yc profile (uncomment if needed)
#yc_profile = "profile-id"

# Local embedding provider (fastembed-backed; multi-model).
[models.providers.fastembed]
type = "fastembed"
# Directory where fastembed stores downloaded ONNX models. Applied to every
# hosted model unless the model overrides it via its own `cache_dir` key.
# When commented out, fastembed's built-in default (~/.cache/fastembed) is used.
#cache_dir = "/var/lib/gromozeka/fastembed-cache"
