# configs/00-defaults/vision.toml
# Native-vision image handling (normalized images stored for direct LLM input).

[bot.vision]
max-image-dimension = 2048   # long-edge px cap, never upscales; 0 = no resize
image-format = "image/jpeg"  # "image/jpeg" | "image/png"
image-quality = 85           # JPEG quality 1-95, ignored for PNG
ttl-days = 30                # retention (days) for stored vision images; the hourly vision GC deletes files whose rows are older (0 disables the GC)
alpha-background = "adaptive"  # background transparent images (e.g. stickers) composite onto when flattened for vision: "adaptive" (contrast the visible pixels) | "white" | "black"
